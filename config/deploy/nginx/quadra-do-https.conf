upstream quadra_do {
  server unix:/home/deploy/apps/quadra-do/shared/tmp/sockets/puma.sock fail_timeout=0;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name quadrado.mastershow.dev.br;

  ssl_certificate /etc/letsencrypt/live/quadrado.mastershow.dev.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/quadrado.mastershow.dev.br/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /home/deploy/apps/quadra-do/current/public;

  access_log /var/log/nginx/quadra-do.access.log;
  error_log /var/log/nginx/quadra-do.error.log;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri @puma;
  }

  location @puma {
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_pass http://quadra_do;
  }
}
