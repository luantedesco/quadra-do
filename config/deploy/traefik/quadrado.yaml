http:
  routers:
    quadrado-http:
      rule: Host(`quadrado.mastershow.dev.br`)
      entryPoints:
        - http
      service: quadrado-http
  services:
    quadrado-http:
      loadBalancer:
        servers:
          - url: "http://10.0.2.1:8088"

tcp:
  routers:
    quadrado-https:
      rule: HostSNI(`quadrado.mastershow.dev.br`)
      entryPoints:
        - https
      service: quadrado-https
      tls:
        passthrough: true
  services:
    quadrado-https:
      loadBalancer:
        servers:
          - address: "10.0.2.1:8443"
